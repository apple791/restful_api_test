name: Restful Booker tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run public practice API tests
        type: boolean
        default: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m pytest -m unit --html=reports/offline-report.html --self-contained-html
      - name: Live practice API tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_live
        run: python -m pytest --live -m integration --html=reports/live-report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
